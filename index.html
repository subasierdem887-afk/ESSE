<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>Bir mesajın var 💬</title><style>
:root{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f8fafc;background:#0b1120}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(ellipse at 30% 10%,#273858 0%,#0b1120 62%)}.phone{width:min(100%,460px);height:min(850px,100dvh);display:flex;flex-direction:column;background:#101827;box-shadow:0 24px 70px #0008;overflow:hidden}@media(min-width:550px){.phone{border:1px solid #334155;border-radius:28px}}header{padding:18px 16px;background:#1d293b;display:flex;align-items:center;gap:12px}.avatar{height:44px;width:44px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,#526a92,#805d9e);font-size:22px}.who{flex:1}.who strong{display:block;font-size:15px}.status{font-size:12px;color:#86efac;margin-top:4px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4ade80;margin-right:5px}.messages{flex:1;overflow:auto;padding:22px 15px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}.bubble{max-width:86%;border-radius:17px;padding:11px 14px;line-height:1.48;font-size:15px;white-space:pre-wrap;animation:pop .25s ease both}.bot{align-self:flex-start;background:#334155;border-bottom-left-radius:4px}.mine{align-self:flex-end;background:#155e75;border-bottom-right-radius:4px}.time{font-size:10px;color:#cbd5e1;text-align:right;margin-top:5px}.typing{display:none;align-self:flex-start;background:#334155;padding:12px 17px;border-radius:16px;color:#cbd5e1;font-size:13px}.typing.show{display:block}.typing span{display:inline-block;animation:bounce 1s infinite}.typing span:nth-child(2){animation-delay:.16s}.typing span:nth-child(3){animation-delay:.32s}form{display:flex;gap:9px;padding:12px 12px max(12px,env(safe-area-inset-bottom));background:#1d293b}input{flex:1;min-width:0;background:#334155;color:white;border:1px solid #475569;border-radius:25px;padding:13px 15px;font:inherit;outline:none}input:focus{border-color:#67e8f9}button{border:0;border-radius:50%;height:46px;width:46px;background:#0891b2;color:white;font-size:19px;cursor:pointer}button:disabled{opacity:.45;cursor:default}.final{align-self:stretch;background:linear-gradient(145deg,#4c1d56,#202c56);border:1px solid #a78bfa55;padding:24px 20px;border-radius:20px;text-align:center;animation:pop .6s ease}.heart{font-size:48px;animation:pulse 1.6s infinite}.final h2{font-size:23px;margin:12px 0}.final p{color:#f5d0fe;line-height:1.6}.again{width:auto;height:auto;border-radius:18px;padding:11px 17px;font-size:14px;background:#7c3aed;margin-top:8px}@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes pulse{50%{transform:scale(1.12)}}
</style></head><body><main class="phone"><header><div class="avatar">🖤</div><div class="who"><strong>ESSE</strong><div class="status"><i class="dot"></i><span id="status">çevrimiçi</span></div></div><span style="font-size:22px">⋮</span></header><section id="messages" class="messages" aria-live="polite"></section><div class="typing" id="typing">yazıyor<span>.</span><span>.</span><span>.</span></div><form id="form"><input id="input" autocomplete="off" maxlength="280" placeholder="ESSE’ye ilk mesajı yaz..." aria-label="Mesajın"><button id="send" type="submit" aria-label="Gönder">➤</button></form></main><script>
const area=document.getElementById('messages'),typing=document.getElementById('typing'),form=document.getElementById('form'),input=document.getElementById('input'),send=document.getElementById('send'),status=document.getElementById('status');let count=0,clues=0,finished=false,busy=false;const sleep=ms=>new Promise(r=>setTimeout(r,ms));const scroll=()=>{area.scrollTop=area.scrollHeight};function bubble(t,mine=false){let el=document.createElement('div');el.className='bubble '+(mine?'mine':'bot');let text=document.createElement('div');text.textContent=t;el.append(text);let tm=document.createElement('div');tm.className='time';tm.textContent=new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});el.append(tm);area.append(el);scroll()}
async function bot(t){busy=true;send.disabled=true;input.disabled=true;status.textContent='yazıyor...';typing.classList.add('show');scroll();await sleep(Math.min(5200,1800+t.length*35+Math.random()*850));typing.classList.remove('show');status.textContent='çevrimiçi';bubble(t);busy=false;input.disabled=false;send.disabled=false;scroll()}
function norm(s){return s.toLocaleLowerCase('tr-TR').normalize('NFD').replace(/[\u0300-\u036f]/g,'')};function answer(s){let t=norm(s);if(/erdem|sevgilim|erkek arkadas|askim/.test(t)){clues++;return 'Hmm... Bir isim söyledin ama ben bunu ne doğrulayabilirim ne de inkâr edebilirim. 😌'}if(/kimsin|kim bu|kimsen|tanisiyor muyuz|nerden tani|nereden tani/.test(t)){clues++;return 'Bir isim versem bütün eğlence biter. İpucu ister misin? 👀'}if(/ipucu|soyle|anlat|merak/.test(t)){clues++;return clues<2?'Peki: Bu sohbet tesadüfen başlamadı. Birisi özellikle gülümsemeni istedi.':'İkinci ipucu: Bu sürprizi hazırlayan kişi seni çok iyi tanıyor. Ama biraz sabırlı ol. 😏'}if(/kork|sapik|rahatsiz|istemiyorum|birak/.test(t))return 'Haklısın, gizem biraz fazla kaçmış olabilir 😅 Bu sadece sana hazırlanmış zararsız bir sürpriz. İstersen burada bitirebiliriz.';if(/naber|nasilsin|iyi misin/.test(t))return 'Şimdi daha iyiyim. Çünkü cevap verdin. 😌 Sen nasılsın bakalım?';if(/iyi|guzel|harika|super/.test(t))return 'Güzel! O zaman bu küçük oyuna devam edebiliriz. 😏';if(/neden|niye|amac/.test(t))return 'Çünkü sıradan bir “merhaba” biraz sıkıcı olurdu. Sana daha ilginç bir şey hazırladık.';if(/haha|ahah|😂|🤣|😄/.test(t))return 'İşte tam da bu tepkiyi görmek istiyordum ahahah 😂';if(/evet|olur|tamam|hazirim/.test(t))return 'O zaman dikkatli ol... Bu sohbetin sonunda ufak bir şey seni bekliyor. 🎁';return ['Bunu söyleyeceğini tahmin etmemiştim ahahah. Peki, sence ben kimim? 👀','Sana küçük bir sır vereyim mi? Bu konuşmanın arkasında bir plan var.','Aslında seni şaşırtmak düşündüğümden daha eğlenceliymiş. 😌','Tamam, galiba artık sürprize yaklaşabiliriz...'][Math.min(count-1,3)]}
async function finale(){finished=true;form.style.display='none';await bot('Pekâlâ... Sanırım gizem yeterince sürdü. Son bir şey göstereceğim.');await sleep(650);let card=document.createElement('div');card.className='final';card.innerHTML='<div class="heart">💌</div><h2>Yakalandın güzel kız!</h2><p>Bu küçük oyunun arkasındaki kişiyi aslında tanıyorsun.<br><br>Bugün seni biraz gülümsetmek istedim.<br>Ve evet... bunu hazırlarken ben de gülümsedim. 😏</p><strong>— Erdem ❤️</strong><br><button class="again" id="again">Bir daha oyna ↻</button>';area.append(card);scroll();document.getElementById('again').onclick=()=>location.reload()}
form.addEventListener('submit',async e=>{e.preventDefault();if(busy||finished)return;let t=input.value.trim();if(!t)return;input.value='';bubble(t,true);count++;if(count>=6){await finale();return}if(count===1){await bot('Naber güzel kız? 😏 Ben ESSE. İlk mesajı senden bekliyordum.');return}await bot(answer(t));if(count===4)await bot('Bu arada... bir sonraki birkaç mesajdan sonra küçük bir sürpriz açılacak. 🎁')});/* İlk mesajı ziyaretçi gönderir; ESSE sonra yanıt verir. */
</script></body></html>
