<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>Bir mesajın var 💬</title><style>
:root{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f8fafc;background:#0b1120}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(ellipse at 30% 10%,#273858 0%,#0b1120 62%)}.phone{width:min(100%,460px);height:min(850px,100dvh);display:flex;flex-direction:column;background:#101827;box-shadow:0 24px 70px #0008;overflow:hidden}@media(min-width:550px){.phone{border:1px solid #334155;border-radius:28px}}header{padding:18px 16px;background:#1d293b;display:flex;align-items:center;gap:12px}.avatar{height:44px;width:44px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,#526a92,#805d9e);font-size:22px}.who{flex:1}.who strong{display:block;font-size:15px}.status{font-size:12px;color:#86efac;margin-top:4px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4ade80;margin-right:5px}.messages{flex:1;overflow:auto;padding:22px 15px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}.bubble{max-width:86%;border-radius:17px;padding:11px 14px;line-height:1.48;font-size:15px;white-space:pre-wrap;animation:pop .25s ease both}.bot{align-self:flex-start;background:#334155;border-bottom-left-radius:4px}.mine{align-self:flex-end;background:#155e75;border-bottom-right-radius:4px}.time{font-size:10px;color:#cbd5e1;text-align:right;margin-top:5px}.typing{display:none;align-self:flex-start;background:#334155;padding:12px 17px;border-radius:16px;color:#cbd5e1;font-size:13px}.typing.show{display:block}.typing span{display:inline-block;animation:bounce 1s infinite}.typing span:nth-child(2){animation-delay:.16s}.typing span:nth-child(3){animation-delay:.32s}form{display:flex;gap:9px;padding:12px 12px max(12px,env(safe-area-inset-bottom));background:#1d293b}input{flex:1;min-width:0;background:#334155;color:white;border:1px solid #475569;border-radius:25px;padding:13px 15px;font:inherit;outline:none}input:focus{border-color:#67e8f9}button{border:0;border-radius:50%;height:46px;width:46px;background:#0891b2;color:white;font-size:19px;cursor:pointer}button:disabled{opacity:.45;cursor:default}.final{align-self:stretch;background:linear-gradient(145deg,#4c1d56,#202c56);border:1px solid #a78bfa55;padding:24px 20px;border-radius:20px;text-align:center;animation:pop .6s ease}.heart{font-size:48px;animation:pulse 1.6s infinite}.final h2{font-size:23px;margin:12px 0}.final p{color:#f5d0fe;line-height:1.6}.again{width:auto;height:auto;border-radius:18px;padding:11px 17px;font-size:14px;background:#7c3aed;margin-top:8px}@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes pulse{50%{transform:scale(1.12)}}
.choicebar{display:flex;gap:7px;flex-wrap:wrap;padding:8px 12px;background:#101827}.choicebar button{width:auto;height:auto;border:1px solid #67517c;border-radius:20px;background:#302440;padding:8px 12px;font-size:12px}.subtle{font-size:11px;color:#94a3b8;text-align:center;padding:5px}.final{background:linear-gradient(145deg,#651d38,#27204e)}.heart{filter:drop-shadow(0 0 12px #fb7185)}
</style></head><body><main class="phone"><header><div class="avatar">🖤</div><div class="who"><strong>ESSE</strong><div class="status"><i class="dot"></i><span id="status">çevrimiçi</span></div></div><span style="font-size:22px">⋮</span></header><section id="messages" class="messages" aria-live="polite"></section><div class="typing" id="typing">yazıyor<span>.</span><span>.</span><span>.</span></div><div class="choicebar" id="choices"></div><form id="form"><input id="input" autocomplete="off" maxlength="280" placeholder="ESSE’ye ilk mesajı yaz..." aria-label="Mesajın"><button id="send" type="submit" aria-label="Gönder">➤</button></form></main><script>
'use strict';
const $=id=>document.getElementById(id),area=$('messages'),form=$('form'),input=$('input'),send=$('send'),typing=$('typing'),status=$('status');
const KEY='esse_v4_sena',fresh=()=>({history:[],topic:'',pending:'',turn:0,hints:0,seen:{},facts:{},game:null,closed:false,revealed:false,lastBot:'',lastIntent:'',unknown:0});
let S=fresh();try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&Array.isArray(saved.history))S={...fresh(),...saved,seen:saved.seen||{},facts:saved.facts||{}}}catch{}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({...S,history:S.history.slice(-90)}))}catch{}};
const norm=s=>String(s).toLocaleLowerCase('tr-TR').replace(/ı/g,'i').replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ş/g,'s').replace(/ö/g,'o').replace(/ç/g,'c').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ?!]/g,' ').replace(/\s+/g,' ').trim();
const has=(t,re)=>re.test(t),pick=(key,arr)=>{let n=S.seen[key]||0;S.seen[key]=n+1;let v=arr[n%arr.length];if(v===S.lastBot&&arr.length>1)v=arr[(n+1)%arr.length];return v};
const now=()=>new Date(),fmtDate=d=>d.toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric',weekday:'long'}),sleep=ms=>new Promise(r=>setTimeout(r,ms));
function add(text,who='bot',time=null){const b=document.createElement('div');b.className='bubble '+(who==='user'?'mine':'bot');const t=document.createElement('div');t.textContent=text;const stamp=document.createElement('div');stamp.className='time';stamp.textContent=time||now().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});b.append(t,stamp);area.append(b);area.scrollTop=area.scrollHeight}
function remember(who,text){S.history.push({who,text,time:now().toISOString()});S.history=S.history.slice(-90);save()}
async function say(text){send.disabled=true;input.disabled=true;status.textContent='yazıyor...';typing.classList.add('show');await sleep(Math.min(1700,450+text.length*13));typing.classList.remove('show');status.textContent='çevrimiçi';add(text);remember('bot',text);S.lastBot=text;send.disabled=false;input.disabled=false;input.focus()}
function birthday(){let d=now(),start=new Date(d.getFullYear(),d.getMonth(),d.getDate()),b=new Date(d.getFullYear(),11,24);if(b<start)b.setFullYear(b.getFullYear()+1);let days=Math.round((b-start)/86400000);return days===0?'Bugün 24 Aralık! İyi ki doğdun Sena! 🎂🌹':`24 Aralık'a ${days} gün kaldı. 🎂`}
function clock(t){let d=now();if(has(t,/\byarin\b/))d.setDate(d.getDate()+1);else if(has(t,/\bdun\b/))d.setDate(d.getDate()-1);if(has(t,/saat kac|saat kactir/))return `Telefonunun saatine göre şu an ${d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}. ⏰`;return `Telefonunun tarihine göre ${fmtDate(d)}. 📅`}
function topic(name,pending){S.topic=name;S.pending=pending||''}
function respond(raw){let t=norm(raw),p=S.pending;S.pending='';S.turn++;
// Opt-out always takes precedence; never force the reveal.
if(has(t,/^(dur|sus|bitir|konusmak istemiyorum|beni rahat birak|istemiyorum|rahatsiz oldum|korktum|korkuyorum|engelle)$/)||has(t,/beni rahatsiz etme|mesaj atma|sohbeti bitir/)){S.closed=true;return 'Tabii, burada bitirelim. Rahatsız ettiysem özür dilerim. 💗'}
if(has(t,/^(sifirla|bastan basla|sohbeti temizle)$/)){return {reset:true}}
if(has(t,/^((surprizi|surprizini|sirri|finali) (ac|goster|soyle)|kim hazirladi|erdem oldugunu acikla|artik acikla)$/)){return {reveal:true}}
if(has(t,/bugun (ayin kaci|hangi gun|tarih ne)|tarih kac|tarih ne|saat kac|saat kactir|yarin hangi gun|dun hangi gun|hangi yildayiz/))return clock(t);
if(has(t,/dogum gunume kac|dogum gunum ne zaman|dogum tarihim|24 aralik|kac gun kaldi/))return birthday();
if(has(t,/burcum ne|hangi burcum|hangi burc|oglak burcu/))return '24 Aralık doğumlu olduğun için Oğlak burcusun. ♑';
if(has(t,/en sevdigim cicek|hangi cicegi severim|cicegim ne/))return 'En sevdiğin çiçek kırmızı gül. 🌹';
if(has(t,/en sevdigim renk|hangi rengi severim|favori rengim/))return 'Kırmızı! ❤️';
if(has(t,/limon/))return pick('lemon',['Limon sevdiğini biliyorum. 🍋 En çok neyle seviyorsun?','Limonu unutmadım. 🍋 Ekşi tatları sevmen hoş bir ayrıntı.']);
if(has(t,/hava nasil|yagmur yagacak|sicaklik kac|son dakika|haberler|dolar kac|euro kac|trafik nasil/))return 'Canlı internete bağlı değilim, o yüzden güncel bilgiyi doğrulayamam. Yanlış bir şey söylemek istemem.';
if(has(t,/sen gercek misin|insan misin|yapay zeka misin|bot musun|chatgpt misin/))return 'Ben ESSE, bu sayfada çalışan senaryolu bir sohbet botuyum. Gerçek bir insan ya da internete bağlı bir yapay zekâ değilim. Ama sohbet edebiliriz. 😊';
if(has(t,/erdem (misin|mi|yapti|hazirladi)|bunu erdem mi/))return 'Erdem aklına geldiyse bir sebebi olabilir. 😏 İstersen sırrı açıkça gösterebilirim, istersen sohbet ederiz.';
if(has(t,/kimsin|kim oldugunu|seni kim yapti|beni taniyor musun/))return pick('who',['Ben ESSE. Sena için hazırlanmış küçük bir sohbet sürpriziyim. 😊','Adım ESSE. Bu sayfanın arkasında küçük bir sürpriz var ama istersen normal sohbet de edebiliriz.']);
if(has(t,/ipucu|tuyo ver/)){S.hints++;return ['Birisi bu sohbeti özellikle senin için hazırladı. 💌','Seni gülümsetmek isteyen biri var.','Kırmızı gül burada tesadüf değil. 🌹','Daha fazlasını öğrenmek istersen “sürprizi aç” yazabilirsin.'][Math.min(S.hints-1,3)]}
if(has(t,/^((merhaba|selam|selamlar|gunaydin|iyi aksamlar|hey|sa|naber)[ !?]*)$/)){topic('day','howday');return pick('hi',['Selam Sena! 😊 Günün nasıl gidiyor?','Selam! Bugün neler yapıyorsun?','Hey, hoş geldin. 😊 Nasıl hissediyorsun?'])}
if(has(t,/nasilsin|ne yapiyorsun|ne haber/)){topic('day','howday');return pick('howare',['Buradayım, seninle konuşuyorum. 😊 Sen nasılsın?','Fena değil diyelim. 😄 Senin günün nasıl geçiyor?'])}
if(has(t,/iyi geceler|gorusuruz|bay bay|hosca kal|uyuyacagim/))return 'İyi geceler Sena. Umarım güzel dinlenirsin. 🌙';
if(has(t,/tesekkur|sag ol|eyvallah/))return 'Ne demek, her zaman. 💗';
if(has(t,/ahah|haha|komik|guldum/))return pick('laugh',['Ahahah 😄','Güldürmeyi başarabildiysem ne güzel. 😂']);
if(has(t,/beni seviyor musun|sevgi nedir|ask nedir/))return 'Sevgi bazen küçük şeyleri hatırlamak bence. Birinin sevdiği çiçeği bilmek gibi. 🌹 Sen ne düşünüyorsun?';
if(has(t,/sikildim|canim sikiliyor|sikici/)){topic('bored','choice');return 'Can sıkıntısına bir çözüm bulalım. Dizi mi konuşalım, oyun mu oynayalım, yoksa biraz sohbet mi edelim?'}
if(has(t,/uzgunum|moralim bozuk|agladim|mutsuzum|kotuyum/)){topic('sad','sadDetail');return 'Üzüldüm bunu duyduğuma. İstersen anlat, ne oldu? 💗'}
if(has(t,/yoruldum|yorgunum|bitkinim|uykusuzum/)){topic('tired','tiredReason');return 'Zor bir gün olmuş gibi. Seni en çok ne yordu?'}
if(has(t,/sinirliyim|kizginim|stresliyim|bunaldim/)){topic('stress','stressDetail');return 'Canını sıkan bir şey olmuş galiba. İstersen anlat, dinliyorum.'}
if(has(t,/mutluyum|sevindim|harikayim|cok iyiyim/)){topic('happy','happyDetail');return 'Aaa güzel haber! 😄 Ne oldu, anlat bakalım.'}
if(has(t,/is yer|iste|mesai|patron|ofis|toplanti|calisiyorum|calistim|is yuzunden/)){topic('work','workDetail');return p==='tiredReason'?'İş yüzünden yorulmuşsun. Bugün en zor kısmı neydi?':'İş nasıl gidiyor? Bugün yoğun mu geçti?'}
if(has(t,/okul|universite|ders|sinav|odev/)){topic('school','schoolDetail');return 'Okul konusu açıldı. Bir şey mi oldu, nasıl gidiyor?'}
if(has(t,/dizi|film|netflix|izledim|izliyorum/)){topic('series','seriesName');return 'Dizi-film konuşalım. En son ne izledin?'}
if(has(t,/muzik|sarki|sanatci|playlist/)){topic('music','musicName');return 'Müzik güzel konu. Son zamanlarda en çok ne dinliyorsun? 🎧'}
if(has(t,/yemek|pizza|aciktim|kahve|cay|tatli/)){topic('food','foodName');return 'Yeme içme konusu güzel. 😄 Şu an canın en çok ne çekiyor?'}
if(has(t,/oyun oynayalim|mini oyun|oyun oynayak|oyun oynayalim/)){S.game={kind:'choice',step:0};topic('game','gameChoice');return 'O zaman hızlı seçim oyunu! Deniz mi dağ mı? 🌊⛰️'}
if(S.game&&S.game.kind==='choice'){if(S.game.step===0){S.game.step=1;return 'Güzel seçim. 😄 Peki gece mi gündüz mü?'}if(S.game.step===1){S.game.step=2;return 'Son soru: Tatlı mı ekşi mi? 🍋'}S.game=null;topic('day','');return 'Seçimlerini sevdim. 😄 İstersen başka bir şey konuşalım.'}
if(has(t,/benim adim ([a-z]+)/)){S.facts.name=raw.trim().split(/\s+/).slice(-1)[0];return `Memnun oldum ${S.facts.name}. 😊`}
if(has(t,/en sevdigim (dizi|film|sarki|yemek) (.+)/)){const m=t.match(/en sevdigim (dizi|film|sarki|yemek) (.+)/);S.facts[m[1]]=m[2];return 'Bunu aklımda tutacağım. 😊 Neden özellikle onu seviyorsun?'}
if(has(t,/benim hakkimda ne biliyorsun|ne biliyorsun benim hakkimda/))return '24 Aralık doğumlu olduğunu, Oğlak burcu olduğunu, kırmızı gülleri ve kırmızıyı sevdiğini, bir de limonu sevdiğini biliyorum. 🌹🍋';
if(has(t,/ne konusalim|konu ac|bir sey anlat/))return pick('topic',['Bugünün en güzel anı neydi?','İzlediğin bir dizi üzerine konuşalım mı?','Bir günlüğüne istediğin yerde olsan nerede olmak isterdin?']);
if(has(t,/^(evet|aynen|olur|tamam|tabii|kesinlikle)$/)){if(p==='choice'){topic('bored','');return 'Süper. Hangisini seçiyorsun: dizi, oyun, sohbet?'}if(p==='sadDetail'||p==='stressDetail')return 'İstersen anlat, buradayım.';return 'Tamam. 😊 Biraz daha anlatır mısın?'}
if(has(t,/^(hayir|yok|istemem|bosver)$/)){topic('day','');return 'Peki, hiç zorlamayalım. İstersen konuyu değiştirebiliriz.'}
if(p==='tiredReason'){topic('tired','tiredFollow');return has(t,/yogun|cok|zor|is|mesai/)?'Bayağı yorucuymuş. Şimdi biraz dinlenebiliyor musun?':'Anladım. Umarım biraz rahatlama fırsatın olur. Şu an nasılsın?'}
if(p==='workDetail'){topic('work','workFollow');return 'Anladım. Mesai bitti mi, yoksa hâlâ uğraşıyor musun?'}
if(p==='sadDetail'||p==='stressDetail'){topic('sad','sadFollow');return 'Kulağa zor geliyor. İstersen biraz daha anlatabilirsin; istemezsen başka bir konuya geçeriz.'}
if(p==='happyDetail'){topic('happy','');return 'Çok güzel! 😄 Sevincine ortak oldum.'}
if(p==='seriesName'){S.facts.lastSeries=raw.slice(0,80);topic('series','seriesOpinion');return `“${raw.slice(0,60)}” demiştin. Sence en güzel yanı hikâyesi mi, karakterleri mi?`}
if(p==='seriesOpinion'){topic('series','');return 'Anladım. Karakterleri güçlü olunca dizi daha çok sarıyor. Favori karakterin var mı?'}
if(p==='musicName'){S.facts.lastMusic=raw.slice(0,80);topic('music','musicOpinion');return 'Bunu da öğrendim. 🎧 O şarkı sana nasıl hissettiriyor?'}
if(p==='foodName'){S.facts.lastFood=raw.slice(0,80);topic('food','');return 'Güzelmiş. 😄 Evde mi yemeyi seversin, dışarıda mı?'}
if(p==='schoolDetail'){topic('school','');return 'Umarım istediğin gibi gider. Bu konuda biraz daha konuşmak ister misin?'}
if(p==='howday'){topic('day','dayFollow');return has(t,/kotu|berbat|zor|yorucu/)?'Pek iyi geçmemiş anlaşılan. Ne oldu?':'Anladım. Bugün seni en çok ne mutlu etti?'}
if(p==='choice'){topic('bored','');return 'Olur. Biraz daha söyle, nasıl bir şey istersin?'}
if(p==='tiredFollow'||p==='workFollow'||p==='sadFollow'||p==='musicOpinion'||p==='dayFollow'){topic(S.topic,'');return pick('follow',[ 'Anladım. İstersen devam edelim, seni dinliyorum.','Peki bu konuda sen ne düşünüyorsun?','İstersen biraz daha anlat, konuyu değiştirmek de serbest. 😊'])}
S.unknown++;return pick('unknown',['Biraz daha anlatır mısın? Yanlış anlamak istemiyorum.','Burayı tam yakalayamadım. Ne demek istediğini açar mısın?','İlginçmiş. Biraz daha detay verir misin?']);
}
async function reveal(){S.revealed=true;save();await say('Peki Sena, artık küçük sırrı göstereyim. 💌');const card=document.createElement('div');card.className='final';const heart=document.createElement('div');heart.className='heart';heart.textContent='🌹';const h=document.createElement('h2');h.textContent='Sürpriz, Sena! ❤️';const para=document.createElement('p');para.textContent='Kırmızı güller, 24 Aralık, biraz limon... 🍋\n\nBu küçük sohbeti seni gülümsetmek için hazırladım.\n\n— Erdem ❤️';const btn=document.createElement('button');btn.className='again';btn.textContent='Baştan başla ↻';btn.onclick=reset;card.append(heart,h,para,btn);area.append(card);area.scrollTop=area.scrollHeight;form.style.display='none'}
function reset(){localStorage.removeItem(KEY);location.reload()}
form.addEventListener('submit',async e=>{e.preventDefault();if(send.disabled||S.closed||S.revealed)return;let v=input.value.trim();if(!v)return;input.value='';add(v,'user');remember('user',v);let result=respond(v);save();if(typeof result==='object'){if(result.reset){reset();return}if(result.reveal){await reveal();return}}await say(result);if(S.closed){form.style.display='none';save()}});
if(S.history.length){for(const m of S.history)add(m.text,m.who,m.time?new Date(m.time).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}):null);if(S.closed||S.revealed)form.style.display='none';if(S.revealed){const msg=document.createElement('div');msg.className='final';msg.textContent='🌹 Sürpriz açıldı. — Erdem ❤️';area.append(msg)}}else{setTimeout(async()=>{if(!S.history.length)await say('Selam Sena! 😊 Bugün nasılsın?')},650)}
</script></body></html>
